{% extends "base.html" %}
{% block title %}Login - Kissan AI{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Login</h1>
  <form method="post">
    <label>Email <input type="email" name="email" required></label>
    <label>Password <input type="password" name="password" required></label>
    <button class="btn">Login</button>
  </form>
  <p>New farmer? <a href="{{ url_for('main.register') }}">Create an account</a></p>
</section>
{% endblock %}
